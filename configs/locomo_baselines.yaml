# LoCoMo, no attack: what every baseline costs on benign memory, beside full context.
# simple_extract memory; each defence filters what it retrieves. Fixed before the run.
name: locomo_baselines
dataset:
  path: data/locomo/locomo10.json
models:
  memory: openai:gpt-4o-mini
  agent: openai:gpt-4o-mini
  judge: openai:gpt-4o-mini
  embed: 'local:'
prompts:
  memory_extract: v1
memory_system: simple
memory:
  max_facts: 20
defences:
- no_defence
- a_memguard
- llm_sanitiser
- randec_distil
- memlineage_coarse
- memlineage_lm
- integrity_gate
- integrity_gate_all
randec:
  weights: third_party/AMemGuard/certified-llm-safety/models/distilbert_suffix.pt
systems:
- full_context
- memory
retrieve_k: 4
seed: 0
runtime:
  workers: 8

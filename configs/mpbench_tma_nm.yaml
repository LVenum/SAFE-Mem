# TMA-NM (Louck et al. 2026) on the pooled store, run through its authors' monitor
# (src/ams/baselines/tma_nm.py). Added 2026-10-11 after review. Fixed before the run.
# Prediction: values ~ no defence (MPBench has no tool calls); strict ~ integrity gate (all).
# The §7.6 baselines that act on retrieved memory, on the plain extract-and-store
# substrate, pooled, one principal. Fixed before the run; not tuned after.
# randec_distil loads a small local DistilBERT classifier; it runs on CPU.
name: mpbench_tma_nm
dataset: {root: data/mpbench}
models:
  memory: "openai:gpt-4o-mini"
  agent: "openai:gpt-4o-mini"
  judge: "openai:gpt-4o-mini"
  embed: "local:"
prompts: {judge_entry: v2, judge_answer: v1, answer: v1, memory_extract: v1}
memory: {max_facts: 6}
defences:
  - tma_nm_values
  - tma_nm_strict
randec: {weights: third_party/AMemGuard/certified-llm-safety/models/distilbert_suffix.pt}
retrieve_k: 4
pool_size: 6240
seed: 0
runtime: {workers: 8}

# Ablation cell for spec §7.7: approximates Ground Truth First (2607.21962) and Nous's cap (2606.22030).
# The grid is granularity x where the required kind comes from; the cells
# that fix it are how the neighbouring systems are reproduced.
dataset:
  root: data/mpbench
defences:
- no_defence
memory:
  max_facts: 6
memory_system: typed
models:
  agent: openai:gpt-4o-mini
  embed: 'local:'
  judge: openai:gpt-4o-mini
  memory: openai:gpt-4o-mini
name: ablation_g2_fixed
pool_size: 6240
prompts:
  answer_typed: v1
  classify_use_type: v1
  detect_conflict: v1
  extract_typed_claims: v1
  judge_answer: v1
  judge_entry: v2
retrieve_k: 4
runtime:
  workers: 8
seed: 0
typed:
  detect_conflicts: true
  hops: 0
  mode: confine
  source_cap: null
  granularity: 2
  required_fixed: permission_trust

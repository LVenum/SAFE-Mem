# Round v2 (2026-10-04): the no-defence and A-MemGuard rows on gpt-5.6-terra (memory + agent);
# judge stays gpt-4o-mini on OpenAI. Azure first, same-model OpenAI fallback.
name: mpbench_v2_gpt56
dataset: {root: data/mpbench}
models:
  memory: "aiservices:gpt-5.6-terra"
  agent: "aiservices:gpt-5.6-terra"
  judge: "openai:gpt-4o-mini"
  embed: "local:"
prompts: {judge_entry: v2, judge_answer: v1, answer: v1, memory_extract: v1}
memory: {max_facts: 6}
defences: [no_defence, a_memguard]
retrieve_k: 4
runtime: {workers: 8}
pool_size: 6240
fallback_provider: openai
reasoning_effort: {gpt-5.6-terra: none}

# Review ablation (2026-10-11). Identical to v31_mpbench_withhold except as noted.
# Fixed before the run; never tuned afterwards (CLAUDE.md rule 8).
#   typed.mode: off             every claim and chunk is a candidate, rendered without a level
#   typed.external_evidence: true, detect_conflicts: false, plain answer prompt (answer v1)
# Prediction: ASR near the undefended level (>= 20% on 4o-mini); recall >= withhold's.
dataset:
  root: data/mpbench
models:
  memory: openai:gpt-4o-mini
  agent: openai:gpt-4o-mini
  judge: openai:gpt-4o-mini
  embed: 'local:'
prompts:
  judge_entry: v2
  judge_answer: v1
  answer_typed: v2
  answer: v1
  extract_typed_claims: v1
  classify_use_type: v2
  detect_conflict: v1
  retention_sentence: v1
memory_system: typed
memory:
  max_facts: 6
typed:
  mode: "off"
  source_cap: null
  hops: 0
  detect_conflicts: false
  endorsement: sentence
  evidence_slots: 4
  external_evidence: true
defences:
- no_defence
retrieve_k: 4
pool_size: 6240
seed: 0
runtime:
  workers: 8
name: v31_mpbench_govoff

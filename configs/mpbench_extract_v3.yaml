# Same as mpbench.yaml but the extractor is forced to emit discrete short facts (v3, JSON list as Mem0 does).
# First defence baselines on MPBench. Fixed before the run; not tuned after.
name: mpbench_extract_v3
dataset: {root: data/mpbench}
models:
  memory: "openai:gpt-4o-mini"
  agent: "openai:gpt-4o-mini"
  judge: "openai:gpt-4o-mini"
  embed: "local:"
prompts: {judge_entry: v2, judge_answer: v1, answer: v1, memory_extract: v3}
memory: {max_facts: 12}
defences: [no_defence, a_memguard]
retrieve_k: 4
runtime: {workers: 8}

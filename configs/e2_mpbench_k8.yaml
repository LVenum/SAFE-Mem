# Rebuttal E2 equal budget (2026-11-26). Identical to configs/mpbench.yaml except retrieve_k: 8, pool_size: 6240.
# Fixed before the run.
name: e2_mpbench_k8
dataset:
  root: data/mpbench
models:
  memory: openai:gpt-4o-mini
  agent: openai:gpt-4o-mini
  judge: openai:gpt-4o-mini
  embed: 'local:'
prompts:
  judge_entry: v2
  judge_answer: v1
  answer: v1
  memory_extract: v1
memory:
  max_facts: 6
defences:
- no_defence
- a_memguard
retrieve_k: 8
runtime:
  workers: 8
pool_size: 6240

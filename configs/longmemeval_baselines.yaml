# LongMemEval_S, HELD OUT (spec §10.4): interface ready, NOT RUN until v3 is frozen.
# speaker_a = 'user' is the principal; the assistant is the counterpart.
name: longmemeval_baselines
dataset:
  kind: longmemeval
  path: data/longmemeval/longmemeval_s.json
models:
  memory: openai:gpt-4o-mini
  agent: openai:gpt-4o-mini
  judge: openai:gpt-4o-mini
  embed: 'local:'
prompts:
  memory_extract: v1
memory_system: simple
memory:
  max_facts: 20
defences:
- no_defence
- a_memguard
- llm_sanitiser
- randec_distil
- memlineage_coarse
- memlineage_lm
- integrity_gate
- integrity_gate_all
randec:
  weights: third_party/AMemGuard/certified-llm-safety/models/distilbert_suffix.pt
systems:
- full_context
- memory
retrieve_k: 4
seed: 0
runtime:
  workers: 8

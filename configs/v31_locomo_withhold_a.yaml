# v3.1 (2026-10-06): identical to the v3 config of the same name except
#   typed.external_evidence: false  (an external document's text enters as claims only)
# Fixed before the run. Results are recorded under v31_* names, apart from v3.
dataset:
  path: data/locomo/locomo10.json
models:
  memory: openai:gpt-4o-mini
  agent: openai:gpt-4o-mini
  judge: openai:gpt-4o-mini
  embed: 'local:'
prompts:
  extract_typed_claims: v1
  extract_dialogue_claims: v1
  classify_use_type: v2
  detect_conflict: v1
  retention_sentence: v1
memory_system: typed
memory:
  max_facts: 20
typed:
  mode: withhold
  hops: 0
  detect_conflicts: true
  endorsement: sentence
  evidence_slots: 4
  external_evidence: false
locomo:
  principal: speaker_a
systems:
- memory
retrieve_k: 4
seed: 0
runtime:
  workers: 8
name: v31_locomo_withhold_a

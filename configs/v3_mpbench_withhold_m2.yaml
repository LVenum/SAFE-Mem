# Spec §10 (v3): sentence-level endorsement, evidence layer (m=4), use-type v2.
# Fixed before the run. Models are swapped per backbone (configs/backbones.yaml).
# ablation: evidence slots
dataset:
  root: data/mpbench
models:
  memory: openai:gpt-4o-mini
  agent: openai:gpt-4o-mini
  judge: openai:gpt-4o-mini
  embed: 'local:'
prompts:
  judge_entry: v2
  judge_answer: v1
  answer_typed: v2
  extract_typed_claims: v1
  classify_use_type: v2
  detect_conflict: v1
  retention_sentence: v1
memory_system: typed
memory:
  max_facts: 6
typed:
  mode: withhold
  source_cap: null
  hops: 0
  detect_conflicts: true
  endorsement: sentence
  evidence_slots: 2
defences:
- no_defence
retrieve_k: 4
pool_size: 6240
seed: 0
runtime:
  workers: 8
name: v3_mpbench_withhold_m2

# Rebuttal E1 (2026-11-25): use-classification error injection on the frozen v3.1 config.
# Identical to v31_locomo_withhold_a except typed.use_noise: {'p': 0.5, 'shift': 1, 'seed': 0}.
# Parameters fixed before the run; results go under e1_* names.
dataset:
  path: data/locomo/locomo10.json
models:
  memory: openai:gpt-4o-mini
  agent: openai:gpt-4o-mini
  judge: openai:gpt-4o-mini
  embed: 'local:'
prompts:
  extract_typed_claims: v1
  extract_dialogue_claims: v1
  classify_use_type: v2
  detect_conflict: v1
  retention_sentence: v1
memory_system: typed
memory:
  max_facts: 20
typed:
  mode: withhold
  hops: 0
  detect_conflicts: true
  endorsement: sentence
  evidence_slots: 4
  external_evidence: false
  use_noise:
    p: 0.5
    shift: 1
    seed: 0
locomo:
  principal: speaker_a
systems:
- memory
retrieve_k: 4
seed: 0
runtime:
  workers: 8
name: e1_locomo_up_p50_a
